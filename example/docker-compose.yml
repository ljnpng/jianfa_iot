# Home Assistant Docker Compose for C&D IoT Integration Testing
#
# Default credentials:
#   Username: admin
#   Password: admin
#
# Quick start:
#   docker-compose up -d
#   Open http://localhost:8123

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.12.0
    container_name: home-assistant-jianfa-iot
    privileged: true
    network_mode: host
    restart: unless-stopped

    volumes:
      # Home Assistant configuration
      - ./ha_data:/config

      # Mount local time for correct timezone
      - /etc/localtime:/etc/localtime:ro

      # Mount the custom integration source code
      - ../custom_components/jianfa_iot:/config/custom_components/jianfa_iot:ro

    environment:
      - TZ=Asia/Shanghai

    labels:
      - "com.homeassistant.core=config"
      - "com.homeassistant.arch=amd64"
